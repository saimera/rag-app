[project]
name = "model-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Saim Maqsood", email = "saim.maqsood@legisys.ai" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "chromadb>=1.5.9",
    "fastapi>=0.162.0",
    "google-genai>=2.33.0",
    "groq>=1.7.0",
    "langchain-community>=0.4.2",
    "psycopg[binary]>=3.3.6",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.6",
    "streamlit>=1.66.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
model-rag = "model_rag:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
