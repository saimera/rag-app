<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model RAG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--surface:#fff;--ink:#14181f;--muted:#5b6472;--line:#e3e6eb;--accent:#2f5bea;--accent-ink:#fff;--soft:#eef2ff;--err:#b42318;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.65 "Nunito",system-ui,sans-serif;display:flex;flex-direction:column}
header{padding:15px 22px;font:600 clamp(15px,calc(2vw - 1px),10px)/1.3 Georgia,"Times New Roman",serif;letter-spacing:-.025em}
main{flex:1;overflow-y:auto}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 24px}
.hero{display:none;text-align:center;padding:0 16px 22px}
.hero h1{margin:0;font:600 clamp(30px,2.5vw,44px)/1.5 "Nunito",system-ui,sans-serif;letter-spacing:-.040em}
footer{padding:10px 16px 20px}
form{max-width:650px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 14px 10px 18px;box-shadow:0 2px 10px rgba(20,24,31,.06)}
form:focus-within{border-color:var(--accent);box-shadow:0 2px 14px rgba(47,91,234,.12)}
textarea{display:block;width:100%;border:0;outline:0;resize:none;background:transparent;color:var(--ink);font:inherit;line-height:1;min-height:1em;max-height:200px;padding:0}
textarea::placeholder{color:var(--muted)}
.bar{display:flex;justify-content:flex-end;margin-top:6px}
button.send{width:36px;height:36px;border:0;border-radius:50%;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:grid;place-items:center}
button.send:disabled{opacity:.35;cursor:not-allowed}
button.send svg{width:18px;height:18px}

/* Home state: heading and box centered on the page */
body.home{justify-content:center;padding-bottom:7vh}
body.home header{position:absolute;top:0;left:0}
body.home main{display:none}
body.home .hero{display:block}
body.home footer{padding-top:0}

.msg{margin-bottom:26px}
.user{display:flex;justify-content:flex-end}
.user .bubble{background:var(--accent);color:var(--accent-ink);padding:10px 15px;border-radius:16px 16px 4px 16px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.bot .body p{margin:0 0 .7em}
.bot .body ul{margin:0 0 .7em;padding-left:1.3em}
.bot .body code{background:var(--soft);padding:1px 5px;border-radius:5px;font-size:.9em}
.bot .body.error{color:var(--err)}
a.cite{display:inline-block;min-width:1.35em;text-align:center;font-size:.75em;font-weight:600;line-height:1.35;margin:0 1px;padding:0 4px;border-radius:6px;background:var(--soft);color:var(--accent);text-decoration:none;vertical-align:.12em}
a.cite:hover{background:var(--accent);color:var(--accent-ink)}
.sources{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.sources h3{margin:0;font-size:13px;font-weight:600;color:var(--muted)}
a.src{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none;font-size:14px}
a.src:hover{border-color:var(--accent)}
a.src .n{flex:none;width:22px;height:22px;border-radius:6px;background:var(--soft);color:var(--accent);font-weight:600;font-size:12px;display:grid;place-items:center}
a.src .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.src .p{flex:none;color:var(--muted);font-size:13px}
.dots{display:inline-flex;gap:5px;padding:6px 0}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:pulse 1.2s infinite ease-in-out}
.dots span:nth-child(2){animation-delay:.15s}
.dots span:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots span{animation:none;opacity:.6}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
form :focus-visible{outline:none}
button.send:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header, header * { font-family: "Nunito", system-ui, sans-serif !important; }
</style>
</head>
<body class="home">
<header>deep research. grounded answers. zero guesswork</header>

<main id="scroll"><div class="wrap" id="chat"></div></main>

<section class="hero"><h1>What shall we dig into?</h1></section>

<footer>
  <form id="form">
    <textarea id="input" rows="2" placeholder="How can I help you today?" aria-label="Your question"></textarea>
    <div class="bar">
      <button class="send" id="send" type="submit" aria-label="Send" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </form>
</footer>

<script>
const chat = document.getElementById('chat');
const scrollBox = document.getElementById('scroll');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
let busy = false;

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function inline(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');
}

function markdown(text){
  const out = []; let items = null;
  const flush = () => { if(items){ out.push('<ul>'+items.map(i=>'<li>'+inline(i)+'</li>').join('')+'</ul>'); items = null; } };
  for(const line of text.split('\n')){
    const m = line.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/);
    if(m){ (items = items || []).push(m[1]); continue; }
    flush();
    if(line.trim()) out.push('<p>'+inline(line)+'</p>');
  }
  flush();
  return out.join('');
}

function withCitations(html, refs){
  const byNum = {}; refs.forEach(r => byNum[r.number] = r);
  return html.replace(/\[(\d+(?:\s*,\s*\d+)*)\]/g, (all, nums) =>
    nums.split(',').map(n => {
      const r = byNum[n.trim()];
      return r ? '<a class="cite" href="'+esc(r.url)+'" target="_blank" rel="noopener" title="'+esc(r.title)+', page '+r.page_no+'">'+n.trim()+'</a>' : '['+n.trim()+']';
    }).join('')
  );
}

function sourcesHtml(refs){
  if(!refs.length) return '';
  return '<div class="sources"><h3>Sources</h3>' + refs.map(r =>
    '<a class="src" href="'+esc(r.url)+'" target="_blank" rel="noopener">'
    + '<span class="n">'+r.number+'</span><span class="t">'+esc(r.title)+'</span><span class="p">page '+r.page_no+'</span></a>'
  ).join('') + '</div>';
}

function addUser(text){
  const el = document.createElement('div');
  el.className = 'msg user';
  el.innerHTML = '<div class="bubble"></div>';
  el.firstChild.textContent = text;
  chat.appendChild(el);
}

function addBot(){
  const el = document.createElement('div');
  el.className = 'msg bot';
  el.innerHTML = '<div class="body"><span class="dots" aria-label="Thinking"><span></span><span></span><span></span></span></div>';
  chat.appendChild(el);
  return el;
}

function toBottom(){ scrollBox.scrollTop = scrollBox.scrollHeight; }

async function ask(query){
  if(busy || !query.trim()) return;
  busy = true; sendBtn.disabled = true;
  document.body.classList.remove('home');
  addUser(query);
  const bot = addBot(); toBottom();
  const body = bot.querySelector('.body');
  try{
    const res = await fetch('/ask', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({query})});
    if(!res.ok) throw new Error('The server returned status '+res.status+'. Check the server logs.');
    const data = await res.json();
    body.innerHTML = withCitations(markdown(data.answer), data.references);
    bot.insertAdjacentHTML('beforeend', sourcesHtml(data.references));
  }catch(err){
    body.classList.add('error');
    body.textContent = err.message.startsWith('The server') ? err.message : 'Could not reach the server. Make sure it is running at this address.';
  }
  busy = false; sendBtn.disabled = !input.value.trim();
  toBottom(); input.focus();
}

function resize(){
  input.style.height = 'auto';
  input.style.height = input.scrollHeight + 'px';
  sendBtn.disabled = busy || !input.value.trim();
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const q = input.value; input.value = ''; resize();
  ask(q);
});
input.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); form.requestSubmit(); }
});
input.addEventListener('input', resize);
input.focus();
</script>
</body>
</html>
